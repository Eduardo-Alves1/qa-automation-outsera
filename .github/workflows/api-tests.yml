name: API Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to execute
        required: true
        default: regression
        type: choice
        options:
          - smoke
          - regression
          - all

permissions:
  contents: read

env:
  BASE_API_URL: https://restful-booker.herokuapp.com
  CI: true

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

  api-tests:
    name: Playwright API tests
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute API test suite
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running smoke suite for pull request"
            npm run test:api:smoke
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Running regression suite for push to main"
            npm run test:api:regression
          else
            case "${{ inputs.suite }}" in
              smoke)
                echo "Running smoke suite"
                npm run test:api:smoke
                ;;
              regression)
                echo "Running regression suite"
                npm run test:api:regression
                ;;
              all)
                echo "Running all API tests"
                npm run test:api
                ;;
              *)
                echo "Invalid suite: ${{ inputs.suite }}"
                exit 1
                ;;
            esac
          fi

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          if [[ -d "allure-results" ]] && [[ -n "$(ls -A allure-results 2>/dev/null)" ]]; then
            npm run allure:generate
          else
            echo "No Allure results found. Skipping report generation."
          fi

      - name: Upload Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-report-${{ github.run_number }}
          path: |
            allure-results/
            allure-report/
          if-no-files-found: ignore
          retention-days: 14
