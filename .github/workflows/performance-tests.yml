name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      vus:
        description: Number of virtual users
        required: true
        default: '5'
        type: string
      duration:
        description: Test duration (for example 30s, 1m, 5m)
        required: true
        default: '30s'
        type: string
      base_url:
        description: Target base URL
        required: true
        default: 'https://restful-booker.herokuapp.com'
        type: string

permissions:
  contents: read

jobs:
  k6-performance:
    name: K6 performance test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Prepare results directory
        run: mkdir -p performance-results

      - name: Execute K6 test
        env:
          PERF_BASE_URL: ${{ inputs.base_url }}
          K6_VUS: ${{ inputs.vus }}
          K6_DURATION: ${{ inputs.duration }}
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_OPEN: 'false'
          K6_WEB_DASHBOARD_EXPORT: performance-results/k6-report.html
        run: |
          k6 run \
            --summary-export=performance-results/k6-summary.json \
            tests/performance/load-test.js

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results-${{ github.run_number }}
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 14
